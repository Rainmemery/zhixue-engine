server:
  port: 0

spring:
  application:
    name: zhixue-gateway-test
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: test-service-route
          uri: lb://test-service
          predicates:
            - Path=/api/test/**

logging:
  level:
    com.rain.zhixuegetaway: debug
    org.springframework: info

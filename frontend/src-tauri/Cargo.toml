[package]
name = "zhixue-engine"
version = "1.0.0"
description = "智学引擎 - AI驱动的智能学习平台"
authors = ["you"]
edition = "2021"

[lib]
name = "zhixue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 应用程序基本配置
spring:
  application:
    name: zhixue-problem  # 应用名称

  # 数据库配置 (如果需要的话)
  datasource:
    url: jdbc:mysql://localhost:3306/zhixue_problem?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true  # 数据库连接地址
    username: root  # 数据库用户名
    password: ${MYSQL_PASSWORD:123456} # 数据库密码，生产环境通过环境变量配置
    driver-class-name: com.mysql.cj.jdbc.Driver  # 数据库驱动类名

    # HikariCP连接池配置
    hikari:
      pool-name: HikariCP-Pool  # 连接池名称
      maximum-pool-size: 20  # 最大连接数
      minimum-idle: 5  # 最小空闲连接数
      connection-timeout: 30000  # 连接超时时间(毫秒)
      idle-timeout: 600000  # 空闲连接超时时间(毫秒)
      max-lifetime: 1800000  # 连接最大存活时间(毫秒)
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 # Nacos Server地址（集群则写：192.168.1.100:8848,192.168.1.101:8848）
        ip: ${NACOS_IP:127.0.0.1}
#        username: nacos # Nacos账号（默认nacos，若修改则对应）
#        password: nacos # Nacos密码（默认nacos，若修改则对应）
        # 可选：配置命名空间/分组（用于环境隔离，如dev/test/prod）
        # namespace: dev-namespace-id # 命名空间ID（Nacos控制台创建后获取）
        # group: DEFAULT_GROUP # 分组名，默认DEFAULT_GROUP
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
#  # JPA配置 (如果使用JPA)
#  jpa:
#    hibernate:
#      ddl-auto: update  # 自动建表策略(create, update, validate, none)
#    show-sql: true  # 显示SQL语句
#    properties:
#      hibernate:
#        format_sql: true  # 格式化SQL语句

#  # Redis配置 (如果使用缓存)
#  redis:
#    host: localhost  # Redis服务器地址
#    port: 6379  # Redis端口号
#    password:  # Redis密码
#    database: 0  # Redis数据库索引
#    timeout: 2000ms  # 连接超时时间
#    lettuce:
#      pool:
#        max-active: 8  # 连接池最大连接数
#        max-wait: -1ms  # 连接池最大阻塞等待时间
#        max-idle: 8  # 连接池中的最大空闲连接
#        min-idle: 0  # 连接池中的最小空闲连接

# 服务器配置
server:
  port: 8082  # 服务端口，用户服务使用独立端口
  servlet:
    context-path: /  # 应用上下文路径

# 日志配置
logging:
  level:
    com.rain.zhixueuser: debug  # 包日志级别
    org.springframework: info  # Spring框架日志级别
    org.hibernate.SQL: debug  # Hibernate SQL日志级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # 控制台日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # 文件日志格式
  file:
    name: logs/zhixue-problem.log  # 日志文件名

# 自定义业务配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # MyBatis映射文件位置
  type-aliases-package: com.rain.zhixueproblem.entity  # 实体类包路径
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射（核心配置）
    call-setters-on-nulls: true # 允许为null的字段调用setter方法
# JWT配置
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}  # JWT密钥，请在生产环境修改
  expiration: 86400000  # JWT过期时间(毫秒)，即24小时
  refreshExpiration: 604800000  # 刷新令牌过期时间(毫秒)，即7天
# 文件上传配置
servlet:
  multipart:
    enabled: true  # 启用文件上传
    max-file-size: 10MB  # 单个文件最大大小
    max-request-size: 50MB  # 单次请求最大大小

judge:
  docker:
    enabled: true
    host: unix:///var/run/docker.sock
  machine:
    cpu-cores: 4
    memory-mb: 4096
    system-reserved-memory-mb: 1024
    container-memory-mb: 512
    container-cpus: 1
    max-concurrency: 4
  container-pool:
    java:
      core-size: 2
      max-size: 4
      max-idle-time-seconds: 300
      borrow-timeout-seconds: 30
      max-reuse-count: 100
      image: judge-java:latest
    cpp:
      core-size: 2
      max-size: 4
      max-idle-time-seconds: 300
      borrow-timeout-seconds: 30
      max-reuse-count: 100
      image: judge-cpp:latest
    c:
      core-size: 1
      max-size: 2
      max-idle-time-seconds: 300
      borrow-timeout-seconds: 30
      max-reuse-count: 100
      image: judge-cpp:latest
  health-check:
    interval-seconds: 60
    max-active-timeout-seconds: 600
  testcase:
    storage-path: /data/testcases
  dispatcher:
    docker-check-interval-seconds: 30
    fallback-enabled: true